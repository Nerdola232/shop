<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astral Shop</title>
    <!-- Se você tiver um arquivo de CSS, ele vai puxar daqui -->
    <link rel="stylesheet" href="style.css">
    <style>
        /* Estilos básicos para garantir que o menu apareça */
        body {
            background-color: #0b0b1a; /* Cor de fundo escura (Astral) */
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .produto {
            background-color: #1a1a2e;
            border: 1px solid #e2b714;
            border-radius: 8px;
            padding: 20px;
            margin: 20px auto;
            max-width: 400px;
        }
        button {
            background-color: #e2b714;
            color: #000;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
        }
        button:hover {
            background-color: #cda411;
        }
    </style>
</head>
<body>

    <header>
        <h1>Astral Shop</h1>
    </header>

    <main>
        <div id="menu-produtos">
            <!-- Seu item para vender -->
            <div class="produto">
                <h2>Conta / Item</h2>
                <p>Descrição do que você está vendendo aqui.</p>
                <!-- Botão que aciona o script de compra -->
                <button onclick="comprarItem('item_01', 1, 'Cliente')">Comprar Agora</button>
            </div>
        </div>
    </main>

    <!-- Puxa o seu arquivo script.js -->
    <script src="script.js"></script>
</body>
</html>
